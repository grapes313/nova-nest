<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard - Nova Nest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1>Admin Dashboard</h1>
    <p>Manage pending and confirmed orders</p>
  </header>

  <main>
    <div class="checkout-container">
      <h2>Pending Orders</h2>
      <ul id="pending-orders"></ul>

      <h2>Confirmed Orders</h2>
      <ul id="confirmed-orders"></ul>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Nova Nest</p>
  </footer>

  <script>
    const pendingOrdersList = document.getElementById("pending-orders");
    const confirmedOrdersList = document.getElementById("confirmed-orders");

    let pendingOrders = JSON.parse(localStorage.getItem("pendingOrders")) || [];
    let confirmedOrders = JSON.parse(localStorage.getItem("confirmedOrders")) || [];

    function renderOrders() {
      pendingOrdersList.innerHTML = "";
      confirmedOrdersList.innerHTML = "";

      // ✅ Show pending orders
      pendingOrders.forEach((order, index) => {
        const li = document.createElement("li");
        li.innerHTML = `
          <strong>${order.name}</strong> (${order.phone})<br>
          Address: ${order.address}<br>
          Items: ${order.items}<br>
          Total: ZMW ${order.total}<br>
          Time: ${order.timestamp}<br>
        `;

        // ✅ Show receipt inline, clickable + downloadable
        if (order.receipt) {
          const receiptLink = document.createElement("a");
          receiptLink.href = order.receipt;
          receiptLink.target = "_blank";
          receiptLink.download = "receipt.png";

          const receiptImg = document.createElement("img");
          receiptImg.src = order.receipt;
          receiptImg.style.maxWidth = "200px";
          receiptImg.style.display = "block";
          receiptImg.style.marginTop = "10px";

          receiptLink.appendChild(receiptImg);
          li.appendChild(receiptLink);
        } else {
          const noReceipt = document.createElement("p");
          noReceipt.textContent = "No receipt uploaded yet.";
          li.appendChild(noReceipt);
        }

        // Confirm button
        const confirmBtn = document.createElement("button");
        confirmBtn.textContent = "Confirm Order";
        confirmBtn.className = "confirm-btn";
        confirmBtn.addEventListener("click", () => {
          confirmedOrders.push(order);
          pendingOrders.splice(index, 1);
          localStorage.setItem("pendingOrders", JSON.stringify(pendingOrders));
          localStorage.setItem("confirmedOrders", JSON.stringify(confirmedOrders));
          renderOrders();
        });
        li.appendChild(confirmBtn);

        // ✅ Remove button
        const removeBtn = document.createElement("button");
        removeBtn.textContent = "Remove Order";
        removeBtn.className = "remove-btn";
        removeBtn.style.marginLeft = "10px";
        removeBtn.addEventListener("click", () => {
          pendingOrders.splice(index, 1);
          localStorage.setItem("pendingOrders", JSON.stringify(pendingOrders));
          renderOrders();
        });
        li.appendChild(removeBtn);

        pendingOrdersList.appendChild(li);
      });

      // ✅ Show confirmed orders
      confirmedOrders.forEach((order, index) => {
        const li = document.createElement("li");
        li.innerHTML = `
          <strong>${order.name}</strong> (${order.phone})<br>
          Address: ${order.address}<br>
          Items: ${order.items}<br>
          Total: ZMW ${order.total}<br>
          Time: ${order.timestamp}<br>
          Status: Confirmed<br>
        `;

        if (order.receipt) {
          const receiptLink = document.createElement("a");
          receiptLink.href = order.receipt;
          receiptLink.target = "_blank";
          receiptLink.download = "receipt.png";

          const receiptImg = document.createElement("img");
          receiptImg.src = order.receipt;
          receiptImg.style.maxWidth = "200px";
          receiptImg.style.display = "block";
          receiptImg.style.marginTop = "10px";

          receiptLink.appendChild(receiptImg);
          li.appendChild(receiptLink);
        }

        // ✅ Remove button for confirmed orders
        const removeBtn = document.createElement("button");
        removeBtn.textContent = "Remove Order";
        removeBtn.className = "remove-btn";
        removeBtn.style.marginTop = "10px";
        removeBtn.addEventListener("click", () => {
          confirmedOrders.splice(index, 1);
          localStorage.setItem("confirmedOrders", JSON.stringify(confirmedOrders));
          renderOrders();
        });
        li.appendChild(removeBtn);

        confirmedOrdersList.appendChild(li);
      });
    }

    renderOrders();
  </script>
</body>
</html>
