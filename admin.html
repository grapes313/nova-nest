<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard - Nova Nest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1>Admin Dashboard</h1>
    <p>Manage pending and confirmed orders</p>
  </header>

  <main>
    <div class="checkout-container">
      <h2>Pending Orders</h2>
      <ul id="pending-orders"></ul>

      <h2>Confirmed Orders</h2>
      <ul id="confirmed-orders"></ul>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Nova Nest</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Supabase init
    const supabase = supabase.createClient(
      "https://mjfbmfdxmqbcgqstoomh.supabase.co",
      "sb_publishable_wL-E_EfSsTODO3MrGGB5oA_IifN-a18"
    );

    const pendingOrdersList = document.getElementById("pending-orders");
    const confirmedOrdersList = document.getElementById("confirmed-orders");

    async function fetchOrders() {
      const { data, error } = await supabase.from("orders").select("*");
      if (error) {
        console.error("Error fetching orders:", error);
        return [];
      }
      return data;
    }

    async function updateOrderStatus(orderId, status) {
      const { error } = await supabase
        .from("orders")
        .update({ status })
        .eq("id", orderId);
      if (error) console.error("Error updating order:", error);
    }

    async function removeOrder(orderId) {
      const { error } = await supabase
        .from("orders")
        .delete()
        .eq("id", orderId);
      if (error) console.error("Error removing order:", error);
    }

    async function renderOrders() {
      pendingOrdersList.innerHTML = "";
      confirmedOrdersList.innerHTML = "";

      const orders = await fetchOrders();
      const pendingOrders = orders.filter(o => o.status === "pending");
      const confirmedOrders = orders.filter(o => o.status === "confirmed");

      // ✅ Render Pending Orders
      pendingOrders.forEach(order => {
        const li = document.createElement("li");
        li.innerHTML = `
          <strong>${order.name}</strong> (${order.phone})<br>
          Address: ${order.address}<br>
          Items: ${order.items}<br>
          Total: ZMW ${order.total}<br>
          Time: ${order.timestamp}<br>
        `;

        if (order.receipt) {
          const receiptImg = document.createElement("img");
          receiptImg.src = order.receipt;
          receiptImg.style.maxWidth = "200px";
          receiptImg.style.display = "block";
          receiptImg.style.marginTop = "10px";

          const downloadBtn = document.createElement("a");
          downloadBtn.href = order.receipt;
          downloadBtn.download = `receipt-${order.id}.png`;
          downloadBtn.textContent = "Download Receipt";
          downloadBtn.style.display = "block";
          downloadBtn.style.marginTop = "5px";

          li.appendChild(receiptImg);
          li.appendChild(downloadBtn);
        } else {
          const noReceipt = document.createElement("p");
          noReceipt.textContent = "No receipt uploaded yet.";
          li.appendChild(noReceipt);
        }

        const confirmBtn = document.createElement("button");
        confirmBtn.textContent = "Confirm Order";
        confirmBtn.className = "confirm-btn";
        confirmBtn.addEventListener("click", async () => {
          await updateOrderStatus(order.id, "confirmed");
          renderOrders();
        });
        li.appendChild(confirmBtn);

        const removeBtn = document.createElement("button");
        removeBtn.textContent = "Remove Order";
        removeBtn.className = "remove-btn";
        removeBtn.style.marginLeft = "10px";
        removeBtn.addEventListener("click", async () => {
          await removeOrder(order.id);
          renderOrders();
        });
        li.appendChild(removeBtn);

        pendingOrdersList.appendChild(li);
      });

      // ✅ Render Confirmed Orders
      confirmedOrders.forEach(order => {
        const li = document.createElement("li");
        li.innerHTML = `
          <strong>${order.name}</strong> (${order.phone})<br>
          Address: ${order.address}<br>
          Items: ${order.items}<br>
          Total: ZMW ${order.total}<br>
          Time: ${order.timestamp}<br>
          Status: Confirmed<br>
        `;

        if (order.receipt) {
          const receiptImg = document.createElement("img");
          receiptImg.src = order.receipt;
          receiptImg.style.maxWidth = "200px";
          receiptImg.style.display = "block";
          receiptImg.style.marginTop = "10px";

          const downloadBtn = document.createElement("a");
          downloadBtn.href = order.receipt;
          downloadBtn.download = `receipt-${order.id}.png`;
          downloadBtn.textContent = "Download Receipt";
          downloadBtn.style.display = "block";
          downloadBtn.style.marginTop = "5px";

          li.appendChild(receiptImg);
          li.appendChild(downloadBtn);
        }

        const removeBtn = document.createElement("button");
        removeBtn.textContent = "Remove Order";
        removeBtn.className = "remove-btn";
        removeBtn.style.marginTop = "10px";
        removeBtn.addEventListener("click", async () => {
          await removeOrder(order.id);
          renderOrders();
        });
        li.appendChild(removeBtn);

        confirmedOrdersList.appendChild(li);
      });
    }

    renderOrders();
  </script>
</body>
</html>
