<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Home & Kitchen - Nova Nest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <nav class="navbar">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="electronics.html">Electronics</a></li>
        <li><a href="fashion.html">Fashion</a></li>
        <li><a href="home-kitchen.html">Home & Kitchen</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="#" id="cart-link">🛒 Cart (<span id="cart-count">0</span>)</a></li>
      </ul>
    </nav>
    <h1>Home & Kitchen</h1>
  </header>

  <main>
    <div class="product-grid">
      <!-- Blender -->
      <div class="product">
        <h3>Electric Blender</h3>
        <img id="blender-image" src="images/blender.jpg" alt="Blender" width="220">

        <label>Model:</label>
        <select id="blender-model">
          <option value="Standard" data-img="images/blender.jpg" data-price="950">Standard</option>
          <option value="Pro" data-img="images/blender-pro.jpg" data-price="1200">Pro</option>
        </select>

        <label>Color:</label>
        <select id="blender-color">
          <option>Black</option>
          <option>White</option>
        </select>

        <p class="price">Price: ZMW <span id="blender-price">950</span></p>
        <button id="add-blender-cart" class="add-cart">Add to Cart</button>
      </div>

      <!-- Cookware Set -->
      <div class="product">
        <h3>Cookware Set</h3>
        <img id="cookware-image" src="images/cookware.jpg" alt="Cookware Set" width="220">

        <label>Size:</label>
        <select id="cookware-size">
          <option value="5pcs" data-img="images/cookware.jpg" data-price="1200">5pcs</option>
          <option value="10pcs" data-img="images/cookware-large.jpg" data-price="2000">10pcs</option>
        </select>

        <p class="price">Price: ZMW <span id="cookware-price">1200</span></p>
        <button id="add-cookware-cart" class="add-cart">Add to Cart</button>
      </div>

      <!-- Microwave -->
      <div class="product">
        <h3>Microwave Oven</h3>
        <img id="microwave-image" src="images/microwave.jpg" alt="Microwave" width="220">

        <label>Capacity:</label>
        <select id="microwave-capacity">
          <option value="20L" data-img="images/microwave.jpg" data-price="2500">20L</option>
          <option value="30L" data-img="images/microwave-large.jpg" data-price="3200">30L</option>
        </select>

        <p class="price">Price: ZMW <span id="microwave-price">2500</span></p>
        <button id="add-microwave-cart" class="add-cart">Add to Cart</button>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Nova Nest</p>
  </footer>

  <!-- Cart Popup -->
  <div id="cart-popup" class="cart-popup" style="display:none;">
    <h2>Your Cart</h2>
    <ul id="cart-items"></ul>
    <button id="checkout-btn">Proceed to Checkout</button>
    <button id="clear-cart">Clear Cart</button>
    <button id="close-cart">Close</button>
  </div>

  <div id="cart-message" style="display:none; position:fixed; top:20px; right:20px; background:#22c55e; color:white; padding:10px 15px; border-radius:6px;">
    Item added to cart!
  </div>

  <script>
    // --- Shared Cart System ---
    let cartItems = JSON.parse(localStorage.getItem("cartItems")) || [];
    const cartCountSpan = document.getElementById("cart-count");
    const cartLink = document.getElementById("cart-link");
    const cartPopup = document.getElementById("cart-popup");
    const cartItemsList = document.getElementById("cart-items");
    const closeCartButton = document.getElementById("close-cart");
    const checkoutBtn = document.getElementById("checkout-btn");
    const clearCartButton = document.getElementById("clear-cart");
    const cartMessage = document.getElementById("cart-message");

    function updateCartCount() { cartCountSpan.textContent = cartItems.length; }
    function saveCart() { localStorage.setItem("cartItems", JSON.stringify(cartItems)); updateCartCount(); }
    function renderCart() {
      cartItemsList.innerHTML = "";
      cartItems.forEach((item, i) => {
        const li = document.createElement("li");
        li.textContent = `${item.name} - ZMW ${item.price}`;
        const removeBtn = document.createElement("button");
        removeBtn.textContent = "Remove";
        removeBtn.style.marginLeft = "10px";
        removeBtn.addEventListener("click", () => {
          cartItems.splice(i, 1);
          saveCart();
          renderCart();
        });
        li.appendChild(removeBtn);
        cartItemsList.appendChild(li);
      });
      updateCartCount();
    }
    renderCart();

    // --- Blender ---
    const blenderModel = document.getElementById("blender-model");
    const blenderImage = document.getElementById("blender-image");
    const blenderPrice = document.getElementById("blender-price");
    document.getElementById("add-blender-cart").addEventListener("click", () => {
      const opt = blenderModel.options[blenderModel.selectedIndex];
      blenderImage.src = opt.dataset.img;
      blenderPrice.textContent = opt.dataset.price;
      const color = document.getElementById("blender-color").value;
      const price = parseFloat(opt.dataset.price);
      cartItems.push({ name: `Blender - ${opt.value} - ${color}`, price });
      saveCart(); renderCart();
      cartMessage.style.display = "block"; setTimeout(() => { cartMessage.style.display = "none"; }, 3000);
    });
    blenderModel.addEventListener("change", () => {
      const opt = blenderModel.options[blenderModel.selectedIndex];
      blenderImage.src = opt.dataset.img;
      blenderPrice.textContent = opt.dataset.price;
    });

    // --- Cookware ---
    const cookwareSize = document.getElementById("cookware-size");
    const cookwareImage = document.getElementById("cookware-image");
    const cookwarePrice = document.getElementById("cookware-price");
    document.getElementById("add-cookware-cart").addEventListener("click", () => {
      const opt = cookwareSize.options[cookwareSize.selectedIndex];
      cookwareImage.src = opt.dataset.img;
      cookwarePrice.textContent = opt.dataset.price;
      const price = parseFloat(opt.dataset.price);
      cartItems.push({ name: `Cookware Set - ${opt.value}`, price });
      saveCart(); renderCart();
      cartMessage.style.display = "block"; setTimeout(() => { cartMessage.style.display = "none"; }, 3000);
    });
    cookwareSize.addEventListener("change", () => {
      const opt = cookwareSize.options[cookwareSize.selectedIndex];
      cookwareImage.src = opt.dataset.img;
      cookwarePrice.textContent = opt.dataset.price;
    });

    // --- Microwave ---
    const microwaveCapacity = document.getElementById("microwave-capacity");
    const microwaveImage = document.getElementById("microwave-image");
    const microwavePrice = document.getElementById("microwave-price");
    document.getElementById("add-microwave-cart").addEventListener("click", () => {
      const opt = microwaveCapacity.options[microwaveCapacity.selectedIndex];
      microwaveImage.src = opt.dataset.img;
      microwavePrice.textContent = opt.dataset.price;
      const price = parseFloat(opt.dataset.price);
      cartItems.push({ name: `Microwave Oven - ${opt.value}`, price });
      saveCart(); renderCart();
      cartMessage.style.display = "block"; setTimeout(() => { cartMessage.style.display = "none"; }, 3000);
    });
    microwaveCapacity.addEventListener("change", () => {
      const opt = microwaveCapacity.options[microwaveCapacity.selectedIndex];
      microwaveImage.src = opt.dataset.img;
      microwavePrice.textContent = opt.dataset.price;
    });

    // --- Cart Controls ---
    cartLink.addEventListener("click", e => {
      e.preventDefault();
      cartPopup.style.display = "block";
    });
    closeCartButton.addEventListener("click", () => {
      cartPopup.style.display = "none";
    });
    checkoutBtn.addEventListener("click", () => {
      window.location.href = "checkout.html";
    });
    clearCartButton.addEventListener("click", () => {
      cartItems = [];
      saveCart();
      renderCart();
      alert("Cart has been cleared!");
    });
  </script>
</body>
</html>
