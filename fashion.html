<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fashion - Nova Nest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <nav class="navbar">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="electronics.html">Electronics</a></li>
        <li><a href="fashion.html">Fashion</a></li>
        <li><a href="home-kitchen.html">Home & Kitchen</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="#" id="cart-link">🛒 Cart (<span id="cart-count">0</span>)</a></li>
      </ul>
    </nav>
    <h1>Fashion</h1>
  </header>

  <main>
    <div class="product-grid">
      <!-- Summer Dress -->
      <div class="product">
        <h3>Summer Dress</h3>
        <img id="dress-image" src="images/dress.jpg" alt="Summer Dress" width="220">

        <label>Size:</label>
        <select id="dress-size">
          <option value="Small" data-img="images/dress.jpg" data-price="450">Small</option>
          <option value="Medium" data-img="images/dress-medium.jpg" data-price="500">Medium</option>
          <option value="Large" data-img="images/dress-large.jpg" data-price="550">Large</option>
        </select>

        <label>Color:</label>
        <select id="dress-color">
          <option>Red</option>
          <option>Blue</option>
          <option>Green</option>
        </select>

        <p class="price">Price: ZMW <span id="dress-price">450</span></p>
        <button id="add-dress-cart" class="add-cart">Add to Cart</button>
      </div>

      <!-- Running Shoes -->
      <div class="product">
        <h3>Running Shoes</h3>
        <img id="shoes-image" src="images/shoes.jpg" alt="Running Shoes" width="220">

        <label>Size:</label>
        <select id="shoes-size">
          <option value="UK 7" data-img="images/shoes.jpg" data-price="800">UK 7</option>
          <option value="UK 8" data-img="images/shoes-uk8.jpg" data-price="850">UK 8</option>
          <option value="UK 9" data-img="images/shoes-uk9.jpg" data-price="900">UK 9</option>
        </select>

        <label>Color:</label>
        <select id="shoes-color">
          <option>Black</option>
          <option>White</option>
          <option>Blue</option>
        </select>

        <p class="price">Price: ZMW <span id="shoes-price">800</span></p>
        <button id="add-shoes-cart" class="add-cart">Add to Cart</button>
      </div>

      <!-- Leather Jacket -->
      <div class="product">
        <h3>Man UTD Leather Jacket</h3>
        <img id="jacket-image" src="images/manutd-leatherjacket.jpg.jpg" alt="Leather Jacket" width="220">

        <label>Size:</label>
        <select id="jacket-size">
          <option value="Small" data-img="images/jacket.jpg" data-price="1500">Small</option>
          <option value="Medium" data-img="images/jacket-medium.jpg" data-price="1600">Medium</option>
          <option value="Large" data-img="images/jacket-large.jpg" data-price="1700">Large</option>
        </select>

        <label>Color:</label>
        <select id="jacket-color">
          <option>Black</option>
          <option>Brown</option>
        </select>

        <p class="price">Price: ZMW <span id="jacket-price">1500</span></p>
        <button id="add-jacket-cart" class="add-cart">Add to Cart</button>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Nova Nest</p>
  </footer>

  <!-- Cart Popup -->
  <div id="cart-popup" class="cart-popup" style="display:none;">
    <h2>Your Cart</h2>
    <ul id="cart-items"></ul>
    <button id="checkout-btn">Proceed to Checkout</button>
    <button id="clear-cart">Clear Cart</button>
    <button id="close-cart">Close</button>
  </div>

  <div id="cart-message" style="display:none; position:fixed; top:20px; right:20px; background:#22c55e; color:white; padding:10px 15px; border-radius:6px;">
    Item added to cart!
  </div>

  <script>
    // Cart system
    let cartItems = JSON.parse(localStorage.getItem("cartItems")) || [];
    const cartCountSpan = document.getElementById("cart-count");
    const cartLink = document.getElementById("cart-link");
    const cartPopup = document.getElementById("cart-popup");
    const cartItemsList = document.getElementById("cart-items");
    const closeCartButton = document.getElementById("close-cart");
    const checkoutBtn = document.getElementById("checkout-btn");
    const clearCartButton = document.getElementById("clear-cart");
    const cartMessage = document.getElementById("cart-message");

    function updateCartCount() { cartCountSpan.textContent = cartItems.length; }
    function saveCart() { localStorage.setItem("cartItems", JSON.stringify(cartItems)); updateCartCount(); }
    function renderCart() {
      cartItemsList.innerHTML = "";
      cartItems.forEach((item, i) => {
        const li = document.createElement("li");
        li.textContent = `${item.name} - ZMW ${item.price}`;
        const removeBtn = document.createElement("button");
        removeBtn.textContent = "Remove";
        removeBtn.style.marginLeft = "10px";
        removeBtn.addEventListener("click", () => {
          cartItems.splice(i, 1);
          saveCart();
          renderCart();
        });
        li.appendChild(removeBtn);
        cartItemsList.appendChild(li);
      });
      updateCartCount();
    }
    renderCart();

    // --- Summer Dress ---
    const dressSize = document.getElementById("dress-size");
    const dressImage = document.getElementById("dress-image");
    const dressPrice = document.getElementById("dress-price");
    document.getElementById("add-dress-cart").addEventListener("click", () => {
      const opt = dressSize.options[dressSize.selectedIndex];
      dressImage.src = opt.dataset.img;
      dressPrice.textContent = opt.dataset.price;
      const color = document.getElementById("dress-color").value;
      const price = parseFloat(opt.dataset.price);
      cartItems.push({ name: `Summer Dress - ${opt.value} - ${color}`, price });
      saveCart(); renderCart();
      cartMessage.style.display = "block"; setTimeout(() => { cartMessage.style.display = "none"; }, 3000);
    });
    dressSize.addEventListener("change", () => {
      const opt = dressSize.options[dressSize.selectedIndex];
      dressImage.src = opt.dataset.img;
      dressPrice.textContent = opt.dataset.price;
    });

    // --- Running Shoes ---
    const shoesSize = document.getElementById("shoes-size");
    const shoesImage = document.getElementById("shoes-image");
    const shoesPrice = document.getElementById("shoes-price");
    document.getElementById("add-shoes-cart").addEventListener("click", () => {
      const opt = shoesSize.options[shoesSize.selectedIndex];
      shoesImage.src = opt.dataset.img;
      shoesPrice.textContent = opt.dataset.price;
      const color = document.getElementById("shoes-color").value;
      const price = parseFloat(opt.dataset.price);
      cartItems.push({ name: `Running Shoes - ${opt.value} - ${color}`, price });
      saveCart(); renderCart();
      cartMessage.style.display = "block"; setTimeout(() => { cartMessage.style.display = "none"; }, 3000);
    });
    shoesSize.addEventListener("change", () => {
      const opt = shoesSize.options[shoesSize.selectedIndex];
      shoesImage.src = opt.dataset.img;
      shoesPrice.textContent = opt.dataset.price;
    });

    // --- Leather Jacket ---
    const jacketSize = document.getElementById("jacket-size");
    const jacketImage = document.getElementById("jacket-image");
    const jacketPrice = document.getElementById("jacket-price");
    document.getElementById("add-jacket-cart").addEventListener("click", () => {
      const opt = jacketSize.options[jacketSize.selectedIndex];
      jacketImage.src = opt.dataset.img;
      jacketPrice.textContent = opt.dataset.price;
      const color = document.getElementById("jacket-color").value;
      const price = parseFloat(opt.dataset.price);
      cartItems.push({ name: `Leather Jacket - ${opt.value} - ${color}`, price });
      saveCart(); renderCart();
      cartMessage.style.display = "block"; setTimeout(() => { cartMessage.style.display = "none"; }, 3000);
    });
    jacketSize.addEventListener("change", () => {
      const opt = jacketSize.options[jacketSize.selectedIndex];
      jacketImage.src = opt.dataset.img;
      jacketPrice.textContent = opt.dataset.price;
    });

    // Cart controls
    cartLink.addEventListener("click", e => {
      e.preventDefault();
      cartPopup.style.display = "block";
    });
    closeCartButton.addEventListener("click", () => {
      cartPopup.style.display = "none";
    });
    checkoutBtn.addEventListener("click", () => {
      window.location.href = "checkout.html";
    });
    clearCartButton.addEventListener("click", () => {
      cartItems = [];
      saveCart();
      renderCart();
      alert("Cart has been cleared!");
    });
  </script>
</body>
</html>
