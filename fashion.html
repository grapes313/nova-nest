  <main>
    <!-- Fur & Leather One-Piece Jacket -->

     <!-- Leather Jacket -->
<div class="product thumbnail-card">
  <h3>Leather Jacket</h3>
  <img id="jacket-image" src="images/jacket.jpg" alt="Leather Jacket" width="220">

  <!-- Thumbnails -->
  <div class="thumbs">
    <img src="images/jacket.jpg" alt="Default" onclick="document.getElementById('jacket-image').src=this.src">

  <!-- Size dropdown (Small–3XL) -->
  <label>Size:</label>

    <option value="Large" data-img="images/jacket.jpg" data-price="1700">Large</option>

  </main>

  <footer class="footer">
    <p>&copy; 2026 Nova Nest</p>
  </footer>

  <!-- Cart Popup -->
  <div id="cart-popup" class="cart-popup" style="display:none;">
    <h2>Your Cart</h2>
    <ul id="cart-items"></ul>
    <button id="checkout-btn">Proceed to Checkout</button>
    <button id="clear-cart">Clear Cart</button>
    <button id="close-cart">Close</button>
  </div>

  <div id="cart-message" style="display:none; position:fixed; top:20px; right:20px; background:#22c55e; color:white; padding:10px 15px; border-radius:6px;">
    Item added to cart!
  </div>

  <script>
    // Cart system
    let cartItems = JSON.parse(localStorage.getItem("cartItems")) || [];
    const cartCountSpan = document.getElementById("cart-count");
    const cartLink = document.getElementById("cart-link");
    const cartPopup = document.getElementById("cart-popup");
    const cartItemsList = document.getElementById("cart-items");
    const closeCartButton = document.getElementById("close-cart");
    const checkoutBtn = document.getElementById("checkout-btn");
    const clearCartButton = document.getElementById("clear-cart");
    const cartMessage = document.getElementById("cart-message");

    function updateCartCount() { cartCountSpan.textContent = cartItems.length; }
    function saveCart() { localStorage.setItem("cartItems", JSON.stringify(cartItems)); updateCartCount(); }
    function renderCart() {
      cartItemsList.innerHTML = "";
      cartItems.forEach((item, i) => {
        const li = document.createElement("li");
        li.textContent = `${item.name} - ZMW ${item.price}`;
        const removeBtn = document.createElement("button");
        removeBtn.textContent = "Remove";
        removeBtn.style.marginLeft = "10px";
        removeBtn.addEventListener("click", () => {
          cartItems.splice(i, 1);
          saveCart();
          renderCart();
        });
        li.appendChild(removeBtn);
        cartItemsList.appendChild(li);
      });
      updateCartCount();
    }
    renderCart();

   // --- Fur & Leather One-Piece Jacket ---
const furJacketSize = document.getElementById("furjacket-size");
const furJacketImage = document.getElementById("furjacket-image");
const furJacketPrice = document.getElementById("furjacket-price");

document.getElementById("add-furjacket-cart").addEventListener("click", () => {
  const opt = furJacketSize.options[furJacketSize.selectedIndex];
  furJacketImage.src = opt.dataset.img;
  furJacketPrice.textContent = opt.dataset.price;
  const color = document.getElementById("furjacket-color").value;
  const price = parseFloat(opt.dataset.price);
  cartItems.push({ name: `Fur & Leather Jacket - ${opt.value} - ${color}`, price });
  saveCart(); renderCart();
  cartMessage.style.display = "block";
  setTimeout(() => { cartMessage.style.display = "none"; }, 3000);
});

furJacketSize.addEventListener("change", () => {
  const opt = furJacketSize.options[furJacketSize.selectedIndex];
  furJacketImage.src = opt.dataset.img;
  furJacketPrice.textContent = opt.dataset.price;
});

// --- Running Shoes ---

  cartMessage.style.display = "block";

shoesSize.addEventListener("change", () => {
  const opt = shoesSize.options[shoesSize.selectedIndex];
  shoesImage.src = opt.dataset.img;
  shoesPrice.textContent = opt.dataset.price;
});

  // --- Leather Jacket ---
const jacketSize = document.getElementById("jacket-size");

document.getElementById("add-jacket-cart").addEventListener("click", () => {

  saveCart(); renderCart();
  cartMessage.style.display = "block";
  setTimeout(() => { cartMessage.style.display = "none"; }, 3000);
});

jacketSize.addEventListener("change", () => {
  const opt = jacketSize.options[jacketSize.selectedIndex];
  jacketImage.src = opt.dataset.img;
  jacketPrice.textContent = opt.dataset.price;
});


    // Cart controls
    cartLink.addEventListener("click", e => {
      e.preventDefault();
      cartPopup.style.display = "block";
    });
    closeCartButton.addEventListener("click", () => {
      cartPopup.style.display = "none";
    });
    checkoutBtn.addEventListener("click", () => {
      window.location.href = "checkout.html";
    });
    clearCartButton.addEventListener("click", () => {
      cartItems = [];
      saveCart();
      renderCart();
      alert("Cart has been cleared!");
    });
  </script>
</body>
